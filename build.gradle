plugins {
  id "com.github.node-gradle.node" version "7.1.0"
}

node {
	download = true
	version = "24.22.2"
}

// Lints the code and the templates with angular-eslint (eslint.config.js).
task lintAngular(type: NpxTask) {
    command = "ng"
    args = ["lint"]
    dependsOn(tasks.npmInstall)
    inputs.dir("src")
    inputs.dir("node_modules")
    inputs.files("angular.json", "eslint.config.js", "tsconfig.json", "tsconfig.app.json", "tsconfig.spec.json")
    outputs.upToDateWhen { true }
}

// Runs the unit tests once, with Vitest in jsdom, and writes their JUnit results to
// build/test-results/testAngular.
task testAngular(type: NpxTask) {
    command = "ng"
    args = ["test", "--watch=false"]
    dependsOn(tasks.npmInstall)
    inputs.dir("src")
    inputs.dir("node_modules")
    inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.spec.json")
    outputs.dir("build/test-results/testAngular")
}

task buildAngular(type: NpxTask) {
    command = "ng"
    args = ["build"]
    dependsOn(tasks.npmInstall)
    inputs.dir(project.fileTree("src").exclude("**/*.spec.ts"))
    inputs.dir("node_modules")
    inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.app.json")
	finalizedBy "nginxConfig"
}

task nginxConfig(type: Copy) {
	from "nginx"
	into "dist"
}

task clean(type: Delete) {
	delete "dist"
}
