name: Commit Stage
on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mikkosuonio-ai/polar-ui
  # Pinned, since a new latest can break the build.
  BUILDER: docker.io/paketobuildpacks/builder-jammy-base:0.4.673
  KUBECONFORM_VERSION: 0.8.0

jobs:
  package:
    name: Test, Build and Publish Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      # The whole history, so that a v* tag can be checked to be on mikkosuonio/development.
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # mikkosuonio/development gets sha-<7 hex>, and a v* tag on it gets the tag's name only, so
      # that a tag's build doesn't replace the branch's image of the same commit. main stays as
      # upstream's. Chosen first, so that a tag that won't be published fails the run at once.
      - name: Choose image tag
        id: tag
        if: >-
          ${{ github.ref == 'refs/heads/mikkosuonio/development'
          || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/mikkosuonio/development; then
              echo "::error::$GITHUB_REF_NAME is not on mikkosuonio/development, so it isn't published"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary k8s
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # testAngular downloads the Node.js in build.gradle and runs the unit tests once with Vitest
      # in jsdom, writing JUnit results to build/test-results/testAngular.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testAngular
      - name: Summarize unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/junit-summary.py "Unit tests" build/test-results/testAngular/*.xml \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/test-results/testAngular/
          retention-days: 14
      # buildAngular builds the SPA into dist/public and copies nginx/ into dist.
      - name: Build SPA
        run: ./gradlew buildAngular
      # The vulnerability scans report to code scanning, as upstream's did, without failing the
      # build. Each upload needs a category of its own, since both are in this job.
      - name: Code vulnerability scanning
        id: scan-code
        uses: anchore/scan-action@v7
        with:
          path: ${{ github.workspace }}
          fail-build: false
          severity-cutoff: high
      - name: Upload code vulnerability report
        if: ${{ !cancelled() && steps.scan-code.outputs.sarif }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan-code.outputs.sarif }}
          category: code
      - name: Set up Pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.2.1
      # The builder's nginx buildpack, with its default nginx version. BP_NGINX_VERSION fails
      # the buildpack's detection (1.3.3) unless there is a buildpack.yml.
      - name: Build image
        run: |
          pack build polar-ui \
            --builder "$BUILDER" \
            --buildpack paketo-buildpacks/nginx \
            --path dist
      - name: Image vulnerability scanning
        id: scan-image
        uses: anchore/scan-action@v7
        with:
          image: polar-ui
          fail-build: false
          severity-cutoff: high
      - name: Upload image vulnerability report
        if: ${{ !cancelled() && steps.scan-image.outputs.sarif }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan-image.outputs.sarif }}
          category: image
      # The e2e tests run against the image just built, so its nginx config is tested too. They
      # mock the API in the browser, so they need no backend.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # No browser to install: the tests use the runner's Google Chrome (UI_TEST_CHANNEL).
      - name: Install the e2e tests' packages
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Start the image
        run: |
          docker run -d --name polar-ui --publish 9004:9004 --env PORT=9004 polar-ui
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:9004/ && exit 0
            sleep 1
          done
          docker logs polar-ui
          exit 1
      - name: e2e tests
        id: e2e
        working-directory: e2e
        env:
          UI_BASE_URL: http://localhost:9004
          UI_TEST_CHANNEL: chrome
          UI_TEST_JUNIT: junit/TEST-e2e.xml
          UI_TEST_REPORT: playwright-report
        run: npx playwright test
      - name: Summarize e2e tests
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: python3 .github/scripts/junit-summary.py "e2e tests" e2e/junit/*.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Show the image's log
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: docker logs polar-ui || true
      # Traces and screenshots of failed tests, and the HTML report.
      - name: Upload e2e test results
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            e2e/junit/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - name: Log into container registry
        if: ${{ steps.tag.outputs.tag }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: ${{ steps.tag.outputs.tag }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker tag polar-ui "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
