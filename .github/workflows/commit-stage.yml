name: Commit Stage
on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mikkosuonio-ai/polar-ui
  # Pinned, since a new latest can break the build.
  BUILDER: docker.io/paketobuildpacks/builder-jammy-base:0.4.673

jobs:
  package:
    name: Test, Build and Publish Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # testAngular downloads Node.js 16 and runs the unit tests once in the runner's Chrome
      # (CHROME_BIN), writing JUnit results to build/test-results/testAngular.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testAngular
      - name: Summarize unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/junit-summary.py "Unit tests" build/test-results/testAngular/*.xml \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/test-results/testAngular/
          retention-days: 14
      # buildAngular builds the SPA into dist/public and copies nginx/ into dist.
      - name: Build SPA
        run: ./gradlew buildAngular
      - name: Set up Pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.2.1
      # The builder's nginx buildpack, with its default nginx version. BP_NGINX_VERSION fails
      # the buildpack's detection (1.3.3) unless there is a buildpack.yml.
      - name: Build image
        run: |
          pack build polar-ui \
            --builder "$BUILDER" \
            --buildpack paketo-buildpacks/nginx \
            --path dist
      # The e2e tests run against the image just built, so its nginx config is tested too. They
      # mock the API in the browser, so they need no backend.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install the e2e tests' packages and browser
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium-headless-shell
      - name: Start the image
        run: |
          docker run -d --name polar-ui --publish 9004:9004 --env PORT=9004 polar-ui
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:9004/ && exit 0
            sleep 1
          done
          docker logs polar-ui
          exit 1
      - name: e2e tests
        id: e2e
        working-directory: e2e
        env:
          UI_BASE_URL: http://localhost:9004
          UI_TEST_JUNIT: junit/TEST-e2e.xml
          UI_TEST_REPORT: playwright-report
        run: npx playwright test
      - name: Summarize e2e tests
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: python3 .github/scripts/junit-summary.py "e2e tests" e2e/junit/*.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Show the image's log
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: docker logs polar-ui || true
      # Traces and screenshots of failed tests, and the HTML report.
      - name: Upload e2e test results
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            e2e/junit/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      # mikkosuonio/development gets sha-<7 hex>, and a v* tag gets its own name as well. main
      # stays as upstream's.
      - name: Choose image tags
        id: tags
        if: >-
          ${{ github.ref == 'refs/heads/mikkosuonio/development'
          || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=" $GITHUB_REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log into container registry
        if: ${{ steps.tags.outputs.tags }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: ${{ steps.tags.outputs.tags }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag polar-ui "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
