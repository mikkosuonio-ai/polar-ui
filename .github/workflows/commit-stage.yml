name: Commit Stage
on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mikkosuonio-ai/polar-ui
  # Pinned, since a new latest can break the build.
  BUILDER: docker.io/paketobuildpacks/builder-jammy-base:0.4.673

jobs:
  package:
    name: Build and Publish Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # buildAngular downloads Node.js 16, builds the SPA into dist/public and copies nginx/ into
      # dist.
      - name: Build SPA
        run: |
          chmod +x gradlew
          ./gradlew buildAngular
      - name: Set up Pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.2.1
      # The builder's nginx buildpack, with its default nginx version. BP_NGINX_VERSION fails
      # the buildpack's detection (1.3.3) unless there is a buildpack.yml.
      - name: Build image
        run: |
          pack build polar-ui \
            --builder "$BUILDER" \
            --buildpack paketo-buildpacks/nginx \
            --path dist
      # mikkosuonio/development gets sha-<7 hex>, and a v* tag gets its own name as well. main
      # stays as upstream's.
      - name: Choose image tags
        id: tags
        if: >-
          ${{ github.ref == 'refs/heads/mikkosuonio/development'
          || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=" $GITHUB_REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log into container registry
        if: ${{ steps.tags.outputs.tags }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: ${{ steps.tags.outputs.tags }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag polar-ui "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
