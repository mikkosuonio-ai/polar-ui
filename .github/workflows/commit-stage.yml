name: Commit Stage
on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mikkosuonio-ai/polar-ui

jobs:
  package:
    name: Build and Publish Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      # The image's build stage builds the SPA, so this step builds both on every push.
      - name: Build image
        run: docker build --file Containerfile --tag polar-ui .
      # mikkosuonio/development gets sha-<7 hex>, and a v* tag gets its own name as well. main
      # stays as upstream's.
      - name: Choose image tags
        id: tags
        if: >-
          ${{ github.ref == 'refs/heads/mikkosuonio/development'
          || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=" $GITHUB_REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log into container registry
        if: ${{ steps.tags.outputs.tags }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: ${{ steps.tags.outputs.tags }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag polar-ui "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
