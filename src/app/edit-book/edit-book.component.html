@if (book) {
  <div class="grid-container">
    <app-book-form
      buttonText="Update Book"
      titleText="Edit Book"
      [currentBook]="book"
      (submitted)="onSubmit($event)">
    </app-book-form>
  </div>
} @else if (loadFailed) {
  <div class="grid-container">
    <p class="load-error">The book can't be loaded. Please try again later.</p>
  </div>
} @else {
  <div class="grid-container">
    <mat-spinner aria-label="Loading"></mat-spinner>
  </div>
}
