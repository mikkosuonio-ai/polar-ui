@if (book) {
  <div class="grid-container">
    <app-book-form
      buttonText="Update Book"
      titleText="Edit Book"
      [currentBook]="book"
      (submitted)="onSubmit($event)">
    </app-book-form>
  </div>
}

@if (!book) {
  <div class="grid-container">
    <mat-spinner></mat-spinner>
  </div>
}
