<form (ngSubmit)="onButtonClicked()">
    <mat-card class="book-card">
        <mat-card-header>
          <mat-card-title>{{ titleText }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>ISBN</mat-label>
                    <input matInput [(ngModel)]="book.isbn" name="isbn">
                </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Title</mat-label>
                    <input matInput [(ngModel)]="book.title" name="title">
                </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Author</mat-label>
                    <input matInput [(ngModel)]="book.author" name="author">
                </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Publisher</mat-label>
                    <input matInput [(ngModel)]="book.publisher" name="publisher">
                </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Price</mat-label>
                    <input matInput type="number" [(ngModel)]="book.price" name="price">
                </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-raised-button color="primary" type="submit">{{ buttonText }}</button>
        </mat-card-actions>
      </mat-card>
</form>
